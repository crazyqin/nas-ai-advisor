version: '3.8'

services:
  # AI Advisor Service
  ai-advisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nas-ai-advisor
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./knowledge:/app/knowledge
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - nas-network

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: nas-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    networks:
      - nas-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
    driver: local

networks:
  nas-network:
    driver: bridge
